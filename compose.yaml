services:
  app:
    build: .
    image: haru-nutri:local
    restart: unless-stopped
    env_file: .env
    environment:
      EMAIL_MODE: ${EMAIL_MODE:?Set EMAIL_MODE to brevo or capture in .env}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-하루영양}
      DATABASE_PATH: /app/data/haru.db
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - haru-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  reminders:
    image: haru-nutri:local
    restart: unless-stopped
    command: ["node", "scripts/reminder-worker.mjs"]
    environment:
      # Only the web service receives the Brevo key and sender configuration.
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env before running Docker Compose}
    depends_on:
      app:
        condition: service_healthy

volumes:
  haru-data:
